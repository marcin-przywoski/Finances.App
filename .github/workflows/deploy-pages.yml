name: Deploy GitHub Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore Finances.App.sln

      - name: Verify i18n parity
        run: python3 scripts/check-i18n-parity.py

      - name: Build solution (Release, -warnaserror)
        run: dotnet build Finances.App.sln -c Release --no-restore -warnaserror

      - name: Run tests
        run: dotnet test Finances.App.Tests/Finances.App.Tests.csproj -c Release --no-build --verbosity normal

      - name: Publish standalone client
        run: dotnet publish Finances.App.Client/Finances.App.Client.csproj -c Release --no-build -o artifacts/publish

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

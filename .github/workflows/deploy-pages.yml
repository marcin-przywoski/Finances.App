name: Deploy GitHub Pages

on:
  push:
    branches:
      - wasm-standalone
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore Finances.App.Client/Finances.App.Client.csproj

      - name: Publish standalone client
        run: dotnet publish Finances.App.Client/Finances.App.Client.csproj -c Release -o artifacts/publish

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/publish/wwwroot
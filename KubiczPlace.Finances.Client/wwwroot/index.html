<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KubiczPlace Finances</title>
    <base href="./" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="standalone-app.css" />
    <link rel="stylesheet" href="KubiczPlace.Finances.Client.styles.css" />
    <script>
        (function (location) {
            if (location.search[1] === '/') {
                var decoded = location.search
                    .slice(1)
                    .split('&')
                    .map(function (part) { return part.replaceAll('~and~', '&'); })
                    .join('?');

                globalThis.history.replaceState(null, '', location.pathname.slice(0, -1) + decoded + location.hash);
            }
        }(globalThis.location));
    </script>
</head>

<body>
    <div id="app">
        <div class="loading-container">
            <div class="spinner"></div>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">x</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="js/standalone-charts.js"></script>
    <script src="js/browserFiles.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>

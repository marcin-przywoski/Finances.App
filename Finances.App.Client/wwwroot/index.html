<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Finances App</title>
    <base href="./" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="standalone-app.css" />
    <link rel="stylesheet" href="Finances.App.Client.styles.css" />
    <script>
        (function (location) {
            if (location.search[1] === '/') {
                var decoded = location.search
                    .slice(1)
                    .split('&')
                    .map(function (part) { return part.replaceAll('~and~', '&'); })
                    .join('?');

                globalThis.history.replaceState(null, '', location.pathname.slice(0, -1) + decoded + location.hash);
            }
        }(globalThis.location));
    </script>
</head>

<body>
    <div id="app">
        <div class="loading-container">
            <div class="spinner"></div>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">x</span>
    </div>

    <script src="lib/chart.js/chart.umd.min.js"></script>
    <script src="js/standalone-charts.js"></script>
    <script src="js/browserFiles.js"></script>
    <script src="js/storageSync.js"></script>
    <script src="js/pwa.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });
        }
    </script>
</body>

</html>
